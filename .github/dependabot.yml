# Dependabot version updates
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Note: Dependabot's "daily" interval runs on weekdays (Mon-Fri).
# Times are in the given IANA timezone; America/New_York tracks ET (EST/EDT).
#
# Minor/patch updates are grouped into a single PR per ecosystem to reduce noise;
# MAJOR bumps arrive individually — EXCEPT for peer-locked families where a lone
# bump would leave an unsatisfiable peer range. Those families travel together as
# one major PR.
version: 2
updates:
  # npm dependencies (package.json / package-lock.json)
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'daily'
      time: '05:00'
      timezone: 'America/New_York'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
      - 'npm'
    ignore:
      # better-auth is held below 1.7 (see #260, and the version-ceiling note in
      # AGENTS.md under Server code). 1.7 throws from `onRequestRateLimit` unless
      # the secondary storage implements `increment`; `better-auth-cloudflare`'s
      # KV adapter does not, and 0.3.1 is its latest release, so there is nothing
      # to bump to. The throw is per REQUEST, not at start-up, so merging 1.7.x
      # would break sign-in, sign-up, and password reset in production.
      #
      # Without this, every re-proposal lands in the npm-minor-and-patch group
      # below and takes the other bumps down with it — which is what happened to
      # #255, blocking four safe updates behind one un-takeable one.
      #
      # Scoped to minor/major ONLY: 1.6.x patches still come through, so a fix
      # released on the current line is not suppressed. Remove this entry when
      # #260 is resolved.
      - dependency-name: 'better-auth'
        update-types:
          - 'version-update:semver-minor'
          - 'version-update:semver-major'
    groups:
      # --- Peer-locked families — majors only. All minor/patch bumps land in the
      #     catch-all group at the bottom. ---

      # astro and @astrojs/* integrations ship in the same monorepo and track the
      # same major; a lone @astrojs/react major bump without a matching astro bump
      # can break peer constraints.
      astro-ecosystem:
        patterns:
          - 'astro'
          - '@astrojs/*'
        update-types:
          - 'major'

      # react + react-dom ship at identical versions and must match at runtime;
      # the @types/* packages track the same major.
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
        update-types:
          - 'major'

      # @testing-library/react and user-event both peer-require @testing-library/dom.
      testing-library:
        patterns:
          - '@testing-library/*'
        update-types:
          - 'major'

      # @vitejs/plugin-react requires a matching Vite major; vitest and @vitest/*
      # track the Vite majors they support.
      vite-ecosystem:
        patterns:
          - 'vite'
          - 'vitest'
          - '@vitejs/plugin-react'
          - '@vitest/*'
        update-types:
          - 'major'

      # oxlint travels alone, minor AND patch. A linter release is not a
      # low-risk bump: a new or recategorized rule that lands in `correctness`
      # is enabled automatically by .oxlintrc.jsonc's `categories` block and
      # fails `npm run lint` on code nobody touched. That is exactly what
      # v1.79.0's `react/react-compiler` split did in #267, where it also took
      # ten unrelated packages down with it — and because `lint` is an early CI
      # gate, nothing after it ran. Kept out of the catch-all group so the new
      # rules arrive as their own reviewable PR.
      oxlint:
        patterns:
          - 'oxlint'
          - 'oxlint-tsgolint'
        update-types:
          - 'minor'
          - 'patch'

      # Bundle low-risk minor + patch bumps into one PR; majors stay separate.
      npm-minor-and-patch:
        patterns:
          - '*'
        exclude-patterns:
          - 'oxlint'
          - 'oxlint-tsgolint'
        update-types:
          - 'minor'
          - 'patch'

  # GitHub Actions used in .github/workflows
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'daily'
      time: '05:00'
      timezone: 'America/New_York'
    commit-message:
      prefix: 'chore'
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
      - 'github-actions'
    groups:
      actions-minor-and-patch:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
