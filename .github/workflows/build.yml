name: CI

# push→main + pull_request covers merges and PR branches without double-running
# every PR commit (the old push:'**' trigger ran each PR commit twice).
on:
  push:
    branches: [main]
  pull_request:

# Minimal token scope: CI only reads the repo to build and test.
permissions:
  contents: read

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Fails when wrangler.toml or the committed environment template changes
      # without regenerating compatibility-scoped runtime and binding types.
      - name: Check generated Worker types
        run: |
          if ! npm run types:worker:check; then
            npm run types:worker
            git diff -- worker-configuration.d.ts
            exit 1
          fi
      - run: npm run format:check
      - run: npm run lint
      # Fails if the generated Claude and Codex agent trees drift from their
      # authored inputs. Fix with `npm run sync:agents`.
      - run: npm run sync:agents -- --check
      # Fails on `Number(x) || <default>`, which silently rewrites a typed zero
      # because Number('') and Number('0') are both 0. Has bitten twice.
      - run: npm run lint:coercions
      - run: npm run lint:migrations
      - run: npm run check
      - run: npm test
      # Worker/D1 integration tests (vitest-pool-workers) — exercises the API
      # handlers against a real workerd + D1 with migrations applied.
      - run: npm run test:server
      - run: npm run build
      # Validates that the adapter-generated config remains consumable by the
      # repository's pinned Wrangler before a real deployment can reach main.
      - run: npm run deploy:check
